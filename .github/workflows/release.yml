name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'   # Trigger saat push tag seperti v1.0.0
  workflow_dispatch:  # Bisa trigger manual dari GitHub UI

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Grant execute permission ke gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Build Debug APK (untuk testing)
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Build Release APK (unsigned — tanpa keystore)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 7. Rename APK agar nama jelas
      - name: Rename APKs
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mkdir -p artifacts
          
          # Copy debug APK
          cp app/build/outputs/apk/debug/app-debug.apk \
             artifacts/SmartNotes-${TAG}-debug.apk
          
          # Copy release APK (unsigned)
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             artifacts/SmartNotes-${TAG}-release-unsigned.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk \
             artifacts/SmartNotes-${TAG}-release.apk 2>/dev/null || true
          
          echo "APK files:"
          ls -lh artifacts/

      # 8. Upload artifacts ke GitHub Actions (bisa didownload dari workflow run)
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartNotes-APKs
          path: artifacts/
          retention-days: 30

      # 9. Buat GitHub Release dengan APK terlampir
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: SmartNotes ${{ github.ref_name }}
          body: |
            ## SmartNotes ${{ github.ref_name }}
            
            ### Download
            Unduh file APK di bawah dan install di perangkat Android kamu.
            
            > **Catatan:** Aktifkan *Install from Unknown Sources* di pengaturan Android untuk menginstal APK.
            
            ### Changelog
            Lihat [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) untuk detail perubahan.
            
            ### Info
            - Min Android: 7.0 (API 24)
            - Target Android: 14 (API 34)
            - Ukuran: ~3 MB
          files: |
            artifacts/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
